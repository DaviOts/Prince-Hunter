name: Prince-Hunter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/prince_hunter_test?schema=public"

    # define the services postgres and redis
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: prince_hunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d prince_hunter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate Prisma Schema
        run: npx prisma db push

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --ci --runInBand

      - name: Build Application
        run: npm run build